            description: "Source game identifier."

          - name: PLAYER_ID
            description: "Source player identifier."

          - name: FIRST_NAME
            description: "Player first name."

          - name: LAST_NAME
            description: "Player last name."

          - name: JERSEY_NUM
            description: "Player jersey number."

          - name: TEAM_ID
            description: "Source team identifier."

          - name: TEAM_NAME
            description: "Team name."

      - name: GAME_SUMMARY
        description: "NBA game status and broadcast metadata."

        columns:
          - name: GAME_ID
            description: "Source game identifier."

          - name: GAME_DATE_EST
            description: "Scheduled game date."

          - name: GAME_STATUS_ID
            description: "Game status identifier."

          - name: GAME_STATUS_TEXT
            description: "Game status description."

          - name: HOME_TEAM_ID
