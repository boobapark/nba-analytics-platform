            description: "Source game identifier."

          - name: GAME_DATE
            description: "Game date."

          - name: SEASON_ID
            description: "Season identifier."

          - name: TEAM_ID_HOME
            description: "Home team identifier."

          - name: TEAM_ID_AWAY
            description: "Away team identifier."

          - name: SEASON_TYPE
            description: "Season type."

      - name: GAME_INFO
        description: "NBA game metadata and attendance information."

        columns:
