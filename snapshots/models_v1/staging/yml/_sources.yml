version: 2

sources:
  - name: nba
    database: BASKETBALL_DEV
    schema: RAW

    tables:

      - name: TEAM
        description: "NBA franchise master reference."

        columns:
          - name: ID
            description: "Source team identifier."

          - name: FULL_NAME
            description: "Full team name."

          - name: ABBREVIATION
            description: "Team abbreviation."

          - name: NICKNAME
            description: "Team nickname."

      - name: TEAM_HISTORY
        description: "Historical franchise names, locations and active periods."

        columns:
          - name: TEAM_ID
            description: "Source team identifier."

          - name: CITY
            description: "Historical team city."

          - name: NICKNAME
            description: "Historical team nickname."

          - name: YEAR_FOUNDED
            description: "First active year of the franchise version."

          - name: YEAR_ACTIVE_TILL
            description: "Last active year of the franchise version."

      - name: TEAM_DETAILS
        description: "NBA franchise information and organization details."

        columns:
          - name: TEAM_ID
            description: "Source team identifier."

          - name: ABBREVIATION
            description: "Team abbreviation."

          - name: NICKNAME
            description: "Team nickname."

          - name: CITY
            description: "Team city."

      - name: PLAY_BY_PLAY
        description: "NBA play-by-play event log."

        columns:
          - name: GAME_ID
            description: "Source game identifier."

          - name: EVENTNUM
            description: "Event sequence within the game."

          - name: EVENTMSGTYPE
            description: "Event category."

          - name: PERIOD
            description: "Game period."

      - name: OTHER_STATS
        description: "Additional NBA game team statistics."

        columns:
          - name: GAME_ID
            description: "Source game identifier."

          - name: LEAGUE_ID
            description: "League identifier."

          - name: TEAM_ID_HOME
            description: "Home team identifier."

          - name: TEAM_ID_AWAY
            description: "Away team identifier."

      - name: OFFICIALS
        description: "NBA game officials assigned to each game."

        columns:
          - name: GAME_ID
            description: "Source game identifier."

          - name: OFFICIAL_ID
            description: "Source official identifier."

          - name: FIRST_NAME
            description: "Official first name."

          - name: LAST_NAME
            description: "Official last name."

          - name: JERSEY_NUM
            description: "Official jersey number."

      - name: LINE_SCORE
        description: "NBA game scoring breakdown by period."

        columns:
          - name: GAME_ID
            description: "Source game identifier."

          - name: GAME_DATE_EST
            description: "Game date."

          - name: TEAM_ID_HOME
            description: "Home team identifier."

          - name: TEAM_ID_AWAY
            description: "Away team identifier."

          - name: PTS_HOME
            description: "Home team final score."

          - name: PTS_AWAY
            description: "Away team final score."

      - name: INACTIVE_PLAYERS
        description: "Players listed as inactive for a given game."

        columns:
