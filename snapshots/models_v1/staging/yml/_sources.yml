            description: "Source game identifier."

          - name: GAME_DATE
            description: "Game date."

          - name: ATTENDANCE
            description: "Official game attendance."

          - name: GAME_TIME
            description: "Game duration."

      - name: DRAFT_HISTORY
        description: "NBA Draft history records."

        columns:
