version: 2

models:
  - name: stg_game_summary
    description: "NBA game status, scheduling and broadcast information."

    columns:

      - name: game_id
        description: "NBA game identifier."
        data_tests:
          - not_null
          - unique

      - name: game_date
        description: "Scheduled game date."

      - name: game_sequence
        description: "Daily game sequence number."

      - name: game_status_id
        description: "Numeric game status identifier."

      - name: game_status
        description: "Game status."

      - name: game_code
        description: "NBA game code."

      - name: home_team_id
        description: "Home team identifier."

      - name: away_team_id
        description: "Away team identifier."

      - name: season
        description: "NBA season."

      - name: live_period
        description: "Current or final game period."

      - name: live_pc_time
        description: "Remaining clock time within the period."

      - name: national_tv_broadcaster
        description: "National television broadcaster."

      - name: live_period_time_broadcast
        description: "Broadcast representation of period and clock."

      - name: wh_status
        description: "Internal status flag."