version: 2

models:
  - name: stg_common_player_info
    description: "Standardized NBA player master data."

    columns:

      - name: player_id
        description: "NBA player identifier."
        data_tests:
          - not_null
          - unique

      - name: full_name
        description: "Player full name."
        data_tests:
          - not_null

      - name: first_name
        description: "Player first name."

      - name: last_name
        description: "Player last name."

      - name: player_slug
        description: "NBA player slug."

      - name: birth_date
        description: "Player birth date."

      - name: school
        description: "Player school."

      - name: country
        description: "Player country."

      - name: height
        description: "Player height."

      - name: weight_lbs
        description: "Player weight in pounds."

      - name: position
        description: "Player position."

      - name: roster_status
        description: "Player roster status."

      - name: team_id
        description: "Team identifier."

      - name: team_name
        description: "Team name."

      - name: team_abbreviation
        description: "Team abbreviation."

      - name: first_season_year
        description: "First NBA season."

      - name: last_season_year
        description: "Last NBA season."

      - name: draft_year
        description: "NBA draft year."

      - name: draft_round
        description: "NBA draft round."

      - name: draft_pick_number
        description: "NBA draft pick number."

      - name: greatest_75_flag
        description: "NBA 75th Anniversary Team indicator."
        data_tests:
          - accepted_values:
              values: ["Y", "N"]