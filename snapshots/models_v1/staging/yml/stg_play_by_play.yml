version: 2

models:
  - name: stg_play_by_play
    description: "Play-by-play event log for NBA games."

    columns:

      - name: game_id
        description: "NBA game identifier."
        data_tests:
          - not_null

      - name: event_number
        description: "Sequential event number within a game."
        data_tests:
          - not_null

      - name: event_type
        description: "High-level event category."

      - name: event_action_type
        description: "Detailed event subtype."

      - name: period
        description: "Game period."

      - name: score
        description: "Game score after the event."

      - name: score_margin
        description: "Score differential after the event."

      - name: player1_id
        description: "Primary player involved."

      - name: player2_id
        description: "Secondary player involved."

      - name: player3_id
        description: "Tertiary player involved."

      - name: video_available_flag
        description: "Indicates whether video is available."

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - game_id
            - event_number