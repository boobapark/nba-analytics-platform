version: 2

models:
  - name: stg_game
    description: "NBA game boxscore summary by game."

    columns:

      - name: game_id
        description: "NBA game identifier."
        data_tests:
          - not_null
          - unique

      - name: game_date
        description: "Game date."

      - name: season_id
        description: "Season identifier."

      - name: season_type
        description: "Season type."

      - name: home_team_id
        description: "Home team identifier."

      - name: away_team_id
        description: "Away team identifier."

      - name: home_result
        description: "Game result for home team."

      - name: away_result
        description: "Game result for away team."