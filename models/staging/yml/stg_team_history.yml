version: 2

models:
  - name: stg_team_history
    description: "Historical NBA franchise identities."

    columns:

      - name: team_id
        description: "NBA franchise identifier."
        data_tests:
          - not_null

      - name: city
        description: "Historical city."

      - name: team_name
        description: "Historical team nickname."

      - name: valid_from_year
        description: "First year this franchise identity was active."

      - name: valid_to_year
        description: "Last year this franchise identity was active."

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_id
            - valid_from_year