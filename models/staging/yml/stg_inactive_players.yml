version: 2

models:
  - name: stg_inactive_players
    description: "Players unavailable and listed inactive for an NBA game."

    columns:

      - name: game_id
        description: "NBA game identifier."
        data_tests:
          - not_null

      - name: player_id
        description: "NBA player identifier."
        data_tests:
          - not_null

      - name: first_name
        description: "Player first name."

      - name: last_name
        description: "Player last name."

      - name: jersey_number
        description: "Player jersey number."

      - name: team_id
        description: "Team identifier."

      - name: team_city
        description: "Team city."

      - name: team_name
        description: "Team name."

      - name: team_abbreviation
        description: "Team abbreviation."