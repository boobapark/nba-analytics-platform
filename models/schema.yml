version: 2

models:

  - name: stg_game
    description: "Statistiques source nettoyées, une ligne par game_id après normalisation des libellés All-Star."
    columns:
      - name: game_id
        description: "Identifiant NBA du match."
        tests:
          - not_null
          - unique

      - name: game_date
        description: "Date locale du match."

      - name: home_team_id
        tests:
          - not_null

      - name: away_team_id
        tests:
          - not_null

      - name: season_type
        tests:
          - accepted_values:
              values:
                - "Regular Season"
                - "Playoffs"
                - "All-Star"
                - "Pre Season"
                - "Play-In Tournament"

  - name: stg_player
    description: "Référentiel de joueurs NBA nettoyé."
    columns:
      - name: player_id
        tests:
          - not_null
          - unique

  - name: stg_team
    description: "Référentiel des franchises NBA."
    columns:
      - name: team_id
        tests:
          - not_null
          - unique

  - name: int_game_enriched
    description: "Grain match enrichi."
    columns:
      - name: game_id
        tests:
          - not_null
          - unique

  - name: int_team_game_stats
    description: "Grain équipe-match."
    columns:
      - name: game_id
        tests:
          - not_null

      - name: team_id
        tests:
          - not_null

      - name: team_role
        tests:
          - accepted_values:
              values:
                - HOME
                - AWAY

  - name: dim_date
    description: "Dimension calendrier."
    columns:
      - name: date_key
        tests:
          - not_null
          - unique

      - name: full_date
        tests:
          - not_null
          - unique

  - name: dim_team
    description: "Dimension équipe."
    columns:
      - name: team_key
        tests:
          - not_null
          - unique

      - name: team_id
        tests:
          - not_null
          - unique

  - name: dim_team_history
    description: "Historique des franchises."
    columns:
      - name: team_history_key
        tests:
          - not_null
          - unique

      - name: team_id
        tests:
          - not_null

  - name: dim_player
    description: "Dimension joueur."
    columns:
      - name: player_key
        tests:
          - not_null
          - unique

      - name: player_id
        tests:
          - not_null
          - unique

  - name: dim_season
    description: "Dimension saison."
    columns:
      - name: season_key
        tests:
          - not_null
          - unique

      - name: season_id
        tests:
          - not_null

      - name: season_type
        tests:
          - not_null

  - name: dim_official
    description: "Dimension arbitre."
    columns:
      - name: official_key
        tests:
          - not_null
          - unique

      - name: official_id
        tests:
          - not_null
          - unique

  - name: fact_team_game
    description: "Fact équipe-match."
    columns:

      - name: team_game_key
        tests:
          - not_null
          - unique

      - name: game_id
        tests:
          - not_null

      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: season_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_season')
              field: season_key

      - name: team_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_key

      - name: opponent_team_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_key

  - name: fact_draft
    description: "Fact Draft."
    columns:

      - name: draft_selection_key
        tests:
          - not_null
          - unique

      - name: player_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_key

      - name: team_key
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_key

  - name: fact_draft_combine
    description: "Fact NBA Combine."
    columns:

      - name: combine_key
        tests:
          - not_null
          - unique

      - name: player_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_key

  - name: fact_game_official
    description: "Pont match-arbitre."
    columns:

      - name: game_official_key
        tests:
          - not_null
          - unique

      - name: official_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_official')
              field: official_key

  - name: fact_inactive_player
    description: "Joueur inactif par match."
    columns:

      - name: inactive_player_key
        tests:
          - not_null
          - unique

      - name: player_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_key

      - name: team_key
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_key

  - name: fact_play_by_play
    description: "Evènements play-by-play."
    columns:

      - name: play_key
        tests:
          - not_null
          - unique

      - name: game_id
        tests:
          - not_null

      - name: event_number
        tests:
          - not_null

      - name: event_category
        tests:
          - accepted_values:
              values:
                - MADE_SHOT
                - MISSED_SHOT
                - FREE_THROW
                - REBOUND
                - TURNOVER
                - FOUL
                - VIOLATION
                - SUBSTITUTION
                - TIMEOUT
                - JUMP_BALL
                - PERIOD_END
                - GAME_END
                - OTHER